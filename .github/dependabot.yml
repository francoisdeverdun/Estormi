# Dependabot configuration (schema v2).
#
# Four ecosystems, one weekly cadence each. Minor + patch bumps are grouped
# per ecosystem into a single PR to keep the noise down; majors stay separate
# so they get individual review. The npm entry covers the pnpm workspace —
# Dependabot's "npm" ecosystem reads pnpm lockfiles too.
version: 2
updates:
  # The repo root has no pip manifest (pyproject declares no [project.dependencies]),
  # so point Dependabot at the real ones: the contributor floor and the pinned
  # bundle/lock under requirements/. Otherwise no Python security bumps are ever
  # proposed — the bundled wheels are the largest attack surface.
  #
  # Dependabot bumps the flat bundle/floor pins but can't re-resolve the lock, so
  # a group PR lands with the lock stale (and sometimes an unsatisfiable pin like
  # numpy past mistral-common's <2.4 cap). The `Requirements consistency` CI
  # guard (.github/workflows/requirements-consistency.yml) fails such a PR fast
  # with the fix: run `make relock` locally (regenerate the lock from the floors,
  # re-derive the bundle to match), then commit both.
  - package-ecosystem: pip
    directories:
      - "/packages/estormi_server"
      - "/requirements"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      # ONE grouped PR for every Python bump across both directories (the
      # contributor floors AND the pinned bundle) — floor bumps must NOT spin
      # off their own PRs (they did: pdfplumber/python-pptx/structlog/llama-cpp
      # each got a solo PR). The pattern is a catch-all and update-types is left
      # unrestricted so a major floor bump (e.g. structlog 24→26) folds into the
      # same group instead of splitting off — the whole Python surface still
      # lands as a single reviewable PR that the `Requirements consistency`
      # guard + `make relock` reconcile in one go. (npm/cargo/actions below keep
      # majors separate; pip is grouped whole because its lock is regenerated
      # atomically, not reviewed pin-by-pin.)
      pip-minor-patch:
        patterns:
          - "*"
    # Structurally unsatisfiable on the py3.12 bundle target — a bump here can
    # never resolve, so Dependabot would re-raise a doomed PR every week. Ignore
    # them until their blocker clears (then drop the entry and bump manually).
    ignore:
      # numpy > 2.3 is capped by mistral-common (`numpy<2.4` for python<=3.12).
      - dependency-name: "numpy"
        versions: [">=2.4"]
      # pydantic pins pydantic-core exactly; it must move with pydantic, never alone.
      - dependency-name: "pydantic-core"
      # transformers + tokenizers are version-coupled; bump them together, by hand.
      - dependency-name: "transformers"
      - dependency-name: "tokenizers"
      # tree-sitter 0.26 changed the grammar API the tree-sitter-* packages pin below it.
      - dependency-name: "tree-sitter"
        versions: [">=0.26"]
      # pdfplumber 0.11.10 conflicts with its pinned transitive deps.
      - dependency-name: "pdfplumber"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: "/apps/estormi-macos"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    groups:
      # The whatsapp-rust family (wacore + the client and its transport/http
      # adapters) is version-coupled — the transport's TransportFactory impl is
      # tied to a specific wacore, so a lone bump splits the tree and breaks the
      # build (it did: transport→0.6 while the rest stayed 0.5). Bundle every
      # family member, all update types, into ONE PR so they move together and a
      # breaking 0.x bump is reviewed as a unit instead of auto-merged piecemeal.
      whatsapp-rust:
        patterns:
          - "whatsapp-rust*"
          - "wacore*"
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
